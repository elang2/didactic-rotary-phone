object_of_measurement:
  - system

model_specificity: model agnostic

domain_specificity: domain agnostic

usage_details: |
  Applied by running a standard test suite across each available SDK
  implementation and comparing the pairwise byte outputs.

  Concrete application: the Model Context Protocol (MCP) has ten
  first-party SDKs. A 40-test differential harness applied to these SDKs
  found 26 divergences (D = 0.65). Recommended confidence interval for
  reported rates: Wilson score at $\alpha = 0.05$; cluster-adjusted
  Wilson where test cases share a generator (input schema, tokenizer,
  or fuzz seed).

known_failure_modes: |
  The metric compares raw bytes; a divergence rate of 1 on raw bytes can be
  0 after canonicalisation. Always report the canonicalisation scheme (or
  its absence) alongside the rate. The rate is also sensitive to
  test-suite completeness: a suite that omits numeric-representation edge
  points reports a lower rate than a suite that includes them.

modality:
  - text
  - structured data

