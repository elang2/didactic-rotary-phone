schema_version: "1.0"

# --- Section 1: Identification and attribution ---
name: Cross-SDK Wire-Level Divergence Rate for AI Agent Tool-Calling Protocols

applied_definition: |
  The fraction of standardised test cases on which independent SDK
  implementations of the same agent-tool-calling wire specification produce
  byte-inequivalent output.

  For $N$ test cases $\{t_1, ..., t_N\}$ applied to $K$ SDK implementations
  $\{S_1, ..., S_K\}$,

  $$ D = \frac{1}{N} \sum_{i=1}^{N} \mathbb{1}\left[\exists\, S_j, S_k\ :\ S_j(t_i) \neq S_k(t_i)\right] $$

  where $S_j(t_i)$ is the byte-string output of SDK $S_j$ on case $t_i$.
  A test case is a single JSON tool-call payload; a test suite is an
  ordered set of such payloads with a stable identifier (git tag or
  SHA-256 of the case set). Reported per protocol-schema version and
  per test-suite identifier.

